
{% extends 'portal/base.html' %}

{% block content %}

<div class="form-container">

    <h2>{{ page_title }}</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Item Name</label>
        <input
            type="text"
            name="title"
            value="{{ item.title|default:'' }}"
            required
        >

        <label>Item Type</label>

        <select name="item_type" required>
            <option value="">Select Type</option>

            <option value="Lost"
                {% if item.item_type == 'Lost' %}selected{% endif %}>
                Lost
            </option>

            <option value="Found"
                {% if item.item_type == 'Found' %}selected{% endif %}>
                Found
            </option>
        </select>


        <label>Category</label>

<select name="category" required>

    <option value="">Select Category</option>

    <option value="Electronics"
        {% if item.category == 'Electronics' %}selected{% endif %}>
        Electronics
    </option>

    <option value="Books"
        {% if item.category == 'Books' %}selected{% endif %}>
        Books
    </option>

    <option value="Accessories"
        {% if item.category == 'Accessories' %}selected{% endif %}>
        Accessories
    </option>

    <option value="Clothing"
        {% if item.category == 'Clothing' %}selected{% endif %}>
        Clothing
    </option>

    <option value="Documents"
        {% if item.category == 'Documents' %}selected{% endif %}>
        Documents
    </option>

    <option value="Other"
        {% if item.category == 'Other' %}selected{% endif %}>
        Other
    </option>

</select>


        <label>Description</label>

        <textarea name="description" rows="5" required>{{ item.description|default:'' }}</textarea>


        <label>Location</label>

        <input
            type="text"
            name="location"
            value="{{ item.location|default:'' }}"
            required
        >


        <label>Contact Information</label>

        <input
            type="text"
            name="contact"
            value="{{ item.contact|default:'' }}"
            required
        >


        <label>Upload Image</label>

        <input type="file" name="image" accept="image/*" id="imageInput">

        <img id="imagePreview"
             class="image-preview"
             alt="Image preview"
             {% if item.image %}
                src="{{ item.image.url }}"
                style="display:block;"
             {% endif %}
        >

        <button type="submit" class="primary-button">
            {{ button_text }}
        </button>

    </form>

</div>

{% endblock %}
